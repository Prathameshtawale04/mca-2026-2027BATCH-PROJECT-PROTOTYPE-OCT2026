{% extends "base.html" %}
{% block title %}404 Not Found{% endblock %}
{% block breadcrumb %}Page Not Found{% endblock %}
{% block content %}
<div class="text-center py-5">
    <div class="d-inline-flex p-3 rounded-circle mb-3 bg-warning bg-opacity-10 text-warning border border-warning-subtle">
        <i class="fas fa-compass fs-1"></i>
    </div>
    <h2 class="fw-bold text-white mb-2">404 &bull; Page Not Found</h2>
    <p class="text-secondary max-w-500 mx-auto mb-4">The requested module, endpoint, or resource could not be found on this server.</p>
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary"><i class="fas fa-arrow-left me-1"></i> Return to Dashboard</a>
</div>
{% endblock %}
