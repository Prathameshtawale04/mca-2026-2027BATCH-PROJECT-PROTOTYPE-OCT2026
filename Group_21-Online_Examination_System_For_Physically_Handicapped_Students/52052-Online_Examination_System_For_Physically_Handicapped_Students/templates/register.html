<!DOCTYPE html>
<html>

<head>

    <title>Student Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/register.css') }}">

</head>

<body>

<div class="container">

    <div class="register-box">

        <h1>Student Registration</h1>

        <p>Create your account</p>

        {% with messages = get_flashed_messages() %}
        {% if messages %}

        {% for message in messages %}

        <div class="message">

            {{ message }}

        </div>

        {% endfor %}

        {% endif %}
        {% endwith %}

        <form id="registerForm" action="/register" method="POST">

            <label>Full Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter Full Name"
                required>

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter Email"
                required>

            <label>Mobile Number</label>

            <input
                type="text"
                name="mobile"
                maxlength="10"
                placeholder="Enter Mobile Number"
                required>

            <label>Gender</label>

            <select name="gender" required>

                <option value="">Select Gender</option>

                <option>Male</option>

                <option>Female</option>

                <option>Other</option>

            </select>

            <label>Date of Birth</label>

            <input
                type="date"
                name="dob"
                required>

            <label>Password</label>

            <input
                type="password"
                name="password"
                id="password"
                placeholder="Enter Password"
                required>

            <label>Confirm Password</label>

            <input
                type="password"
                name="confirm_password"
                id="confirm"
                placeholder="Confirm Password"
                required>

            <input
                type="submit"
                value="Register">

        </form>

        <p class="login">

            Already have an account?

            <a href="/login">

                Login Here

            </a>

        </p>

    </div>

</div>

<link rel="stylesheet" href="{{ url_for('static', filename='css/voice-controls.css') }}">
<script src="{{ url_for('static', filename='js/site_voice.js') }}"></script>

</body>

</html>
