<!DOCTYPE html>
<html>

<head>

    <title>Face Verification</title>

</head>

<body data-student-id="{{ session['student_id'] }}">

    <h2>Face Verification</h2>

    <p>

        Please look at the camera.

    </p>

    <div class="verify-stage">
        <video id="video" width="640" height="480" autoplay playsinline></video>
        <canvas id="faceOverlay" aria-hidden="true"></canvas>
    </div>

    <br><br>

    <button id="verifyButton" onclick="verifyFace()">

        Verify Face

    </button>

    <p id="message" aria-live="polite"></p>

    <style>
        .verify-stage { position: relative; display: inline-block; line-height: 0; max-width: 100%; }
        .verify-stage video { display: block; max-width: 100%; height: auto; }
        #faceOverlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    </style>

    <script src="{{ url_for('static', filename='js/verify_face.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/voice-controls.css') }}">
    <script src="{{ url_for('static', filename='js/site_voice.js') }}"></script>

</body>

</html>
